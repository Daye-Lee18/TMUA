<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">Quadrilateral family tree</title><desc id="desc">One-way arrows run from square to rhombus and rectangle, from those to parallelogram, and from parallelogram to trapezium. Kite is separate.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0b5563"/></marker></defs>
  <rect width="820" height="300" rx="12" fill="#fff"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#111">
    <g stroke="#0b5563" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M410 61L270 105"/><path d="M410 61L550 105"/><path d="M270 151L390 194"/><path d="M550 151L430 194"/><path d="M410 239L410 270"/></g>
    <g fill="#f4f7f7" stroke="#0b5563" stroke-width="2"><rect x="340" y="20" width="140" height="42" rx="7"/><rect x="195" y="107" width="150" height="44" rx="7"/><rect x="475" y="107" width="150" height="44" rx="7"/><rect x="320" y="195" width="180" height="44" rx="7"/><rect x="335" y="255" width="150" height="36" rx="7"/></g>
    <g font-size="19" font-weight="700"><text x="410" y="47">SQUARE</text><text x="270" y="135">RHOMBUS</text><text x="550" y="135">RECTANGLE</text><text x="410" y="223">PARALLELOGRAM</text><text x="410" y="279">TRAPEZIUM</text></g>
    <rect x="665" y="107" width="115" height="44" rx="7" fill="#fff7e6" stroke="#9a6700" stroke-width="2"/><text x="722" y="135" font-size="19" font-weight="700">KITE</text><text x="722" y="174" font-size="14" fill="#6b4b00">separate branch</text>
    <text x="105" y="45" font-size="15" font-weight="700" fill="#0b5563">Read arrows downward</text><text x="105" y="67" font-size="14">every square is a rhombus;</text><text x="105" y="87" font-size="14">not every rhombus is a square</text>
  </g>
</svg>
