<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
  <title id="title">SSA ambiguous case</title><desc id="desc">A ray from A intersects a circle centred at B twice, forming two different triangles with the same side-side-angle information.</desc>
  <rect width="820" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><circle cx="580" cy="200" r="130" fill="#f8fbfb" stroke="#9a6700" stroke-width="2" stroke-dasharray="7 6"/><path d="M100 240L730 66" stroke="#0b5563" stroke-width="3" fill="none"/><path d="M580 200L465 139M580 200L647 89" stroke="#9a6700" stroke-width="3"/><path d="M100 240L465 139L580 200ZM100 240L647 89L580 200Z" fill="#0b5563" fill-opacity=".08" stroke="#0b5563" stroke-width="2"/><path d="M155 240A55 55 0 0 0 153 225" fill="none" stroke="#9a6700" stroke-width="3"/><g font-size="17" font-weight="700"><text x="82" y="260">A</text><text x="585" y="224">B</text><text x="449" y="129">C₁</text><text x="656" y="84">C₂</text></g><g font-size="15"><text x="205" y="210">same angle A</text><text x="530" y="155">BC₁ = BC₂</text><text x="365" y="255">same AB</text><text x="410" y="32" text-anchor="middle" font-weight="700">One ray meets the fixed-length circle twice → two valid triangles</text></g></g>
</svg>
