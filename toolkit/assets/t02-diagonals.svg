<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Diagonal properties of quadrilaterals</title><desc id="desc">Five shapes show which diagonals bisect, are equal, or are perpendicular.</desc>
  <rect width="1000" height="300" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#111"><g fill="#f4f7f7" stroke="#0b5563" stroke-width="3"><path d="M35 145L80 55H185L140 145Z"/><rect x="225" y="55" width="150" height="90"/><path d="M415 100L500 50L585 100L500 150Z"/><rect x="625" y="50" width="100" height="100"/><path d="M790 100L875 45L960 100L875 165Z"/></g><g stroke="#9a6700" stroke-width="2.5"><path d="M35 145L185 55M80 55L140 145M225 55L375 145M375 55L225 145M415 100L585 100M500 50L500 150M625 50L725 150M725 50L625 150M790 100L960 100M875 45L875 165"/></g>
  <g font-size="17" font-weight="700"><text x="110" y="195">PARALLELOGRAM</text><text x="300" y="195">RECTANGLE</text><text x="500" y="195">RHOMBUS</text><text x="675" y="195">SQUARE</text><text x="875" y="195">KITE</text></g><g font-size="14"><text x="110" y="220">bisect</text><text x="300" y="220">bisect + equal</text><text x="500" y="216">bisect +</text><text x="500" y="236">perpendicular</text><text x="675" y="220">all three</text><text x="875" y="220">one bisects the other</text><text x="875" y="240">+ perpendicular</text></g>
  <g transform="translate(270 264)" font-size="13"><circle cx="0" cy="0" r="4" fill="#0b5563"/><text x="75" y="5">crossing point = bisection</text><path d="M220 -8v16M212 0h16" stroke="#9a6700" stroke-width="2"/><text x="318" y="5">right-angle crossing = perpendicular</text></g></g>
</svg>
