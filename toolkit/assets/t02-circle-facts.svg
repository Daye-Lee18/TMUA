<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Four circle facts</title>
  <desc id="desc">Four panels show an angle in a semicircle is 90 degrees, a tangent is perpendicular to the radius, opposite angles of a cyclic quadrilateral total 180 degrees, and equal chords make equal angles at the centre.</desc>
  <rect width="1000" height="500" rx="12" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#111">
    <g fill="#f8fbfb" stroke="#d4dddd"><rect x="15" y="15" width="475" height="225" rx="10"/><rect x="510" y="15" width="475" height="225" rx="10"/><rect x="15" y="260" width="475" height="225" rx="10"/><rect x="510" y="260" width="475" height="225" rx="10"/></g>

    <!-- 1: angle in a semicircle -->
    <g transform="translate(15 15)">
      <text x="18" y="30" font-size="18" font-weight="700">1 · ANGLE IN A SEMICIRCLE</text>
      <circle cx="235" cy="130" r="78" fill="none" stroke="#0b5563" stroke-width="3"/>
      <path d="M157 130H313M157 130L245 53L313 130" fill="#0b5563" fill-opacity=".08" stroke="#0b5563" stroke-width="3"/>
      <path d="M236 61l9 10 10-9" fill="none" stroke="#9a6700" stroke-width="3"/>
      <circle cx="235" cy="130" r="4" fill="#0b5563"/>
      <text x="269" y="76" font-size="17" font-weight="700" fill="#9a6700">90°</text>
      <text x="235" y="216" text-anchor="middle" font-size="15">diameter → angle at the circumference is 90°</text>
    </g>

    <!-- 2: tangent and radius -->
    <g transform="translate(510 15)">
      <text x="18" y="30" font-size="18" font-weight="700">2 · TANGENT ⟂ RADIUS</text>
      <circle cx="215" cy="126" r="72" fill="none" stroke="#0b5563" stroke-width="3"/>
      <path d="M287 48V204" stroke="#0b5563" stroke-width="3"/>
      <path d="M215 126H287" stroke="#9a6700" stroke-width="3"/>
      <path d="M270 126v-17h17" fill="none" stroke="#9a6700" stroke-width="3"/>
      <circle cx="215" cy="126" r="4" fill="#0b5563"/><circle cx="287" cy="126" r="4" fill="#9a6700"/>
      <text x="250" y="116" font-size="16">radius</text><text x="302" y="132" font-size="16">tangent</text>
      <text x="235" y="216" text-anchor="middle" font-size="15">the radius to the touching point meets the tangent at 90°</text>
    </g>

    <!-- 3: cyclic quadrilateral -->
    <g transform="translate(15 260)">
      <text x="18" y="30" font-size="18" font-weight="700">3 · CYCLIC QUADRILATERAL</text>
      <circle cx="235" cy="128" r="80" fill="none" stroke="#0b5563" stroke-width="3"/>
      <path d="M176 74L294 76L300 169L164 164Z" fill="#0b5563" fill-opacity=".08" stroke="#0b5563" stroke-width="3"/>
      <path d="M184 82A18 18 0 0 1 198 75M290 153A20 20 0 0 1 278 167" fill="none" stroke="#9a6700" stroke-width="3"/>
      <text x="201" y="101" font-size="17" font-weight="700" fill="#9a6700">A</text>
      <text x="267" y="155" font-size="17" font-weight="700" fill="#9a6700">C</text>
      <text x="235" y="215" text-anchor="middle" font-size="17" font-weight="700">A + C = 180°</text>
    </g>

    <!-- 4: equal chords -->
    <g transform="translate(510 260)">
      <text x="18" y="30" font-size="18" font-weight="700">4 · EQUAL CHORDS</text>
      <circle cx="235" cy="128" r="80" fill="none" stroke="#0b5563" stroke-width="3"/>
      <path d="M176 72L235 48M294 72L235 48" stroke="#0b5563" stroke-width="4"/>
      <path d="M205 59l5 12M265 59l-5 12" stroke="#9a6700" stroke-width="3"/>
      <path d="M235 128L176 72M235 128L235 48M235 128L294 72" stroke="#9a6700" stroke-width="2.5"/>
      <path d="M219 113A22 22 0 0 1 235 106M235 106A22 22 0 0 1 251 113" fill="none" stroke="#0b5563" stroke-width="2.5"/>
      <circle cx="235" cy="128" r="4" fill="#0b5563"/>
      <text x="205" y="111" font-size="16" font-weight="700">θ</text><text x="257" y="111" font-size="16" font-weight="700">θ</text>
      <text x="235" y="215" text-anchor="middle" font-size="15">equal chords → equal angles at the centre</text>
    </g>
  </g>
</svg>
